<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💌 Carta com Carinho — Demonstração</title>
  
  <!-- Recursos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --spotify-green: #1DB954;
      --rose-main: #d83a56;
      --rose-light: #ffc2cc;
      --gold: #d4af37;
      --cream: #fff9f0;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.7s ease-in-out;
    }

    /* ========== SISTEMA DE TELAS ========== */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(30px) scale(0.98);
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .screen.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      position: relative;
    }

    /* FUNDO DAS TELAS */
    .bg-inicio {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 35%, #312e81 65%, #1e293b 100%);
      background-size: 400% 400%;
      animation: bgShift 15s ease infinite;
    }
    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .bg-carta {
      background: 
        radial-gradient(circle at 20% 20%, rgba(255,182,193,0.4) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255,218,185,0.4) 0%, transparent 50%),
        linear-gradient(135deg, #fff0f3 0%, #ffd6e0 30%, #ffecd2 70%, #fff8f0 100%);
    }

    .bg-player {
      background: 
        radial-gradient(ellipse at top, #1a3320 0%, transparent 60%),
        radial-gradient(ellipse at bottom, #121212 0%, #000000 100%);
    }

    /* ========== EFEITOS DE VIDRO ========== */
    .glass-premium {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 
        0 30px 60px -15px rgba(0, 0, 0, 0.15),
        0 0 0 1px rgba(255, 255, 255, 0.6) inset,
        0 3px 15px rgba(216, 58, 86, 0.08);
      border-radius: 28px;
    }

    .glass-dark-premium {
      background: rgba(24, 24, 24, 0.85);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        0 35px 70px -20px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      border-radius: 28px;
    }

    /* ========== ANIMAÇÕES ========== */
    .fade-in-up {
      animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .scale-in {
      animation: scaleIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .float-gentle {
      animation: floatGentle 4s ease-in-out infinite;
    }
    @keyframes floatGentle {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }

    .pulse-glow-rose {
      animation: pulseGlowRose 3s ease-in-out infinite;
    }
    @keyframes pulseGlowRose {
      0%, 100% { box-shadow: 0 0 20px rgba(216, 58, 86, 0.3); }
      50% { box-shadow: 0 0 40px rgba(216, 58, 86, 0.5), 0 0 60px rgba(216, 58, 86, 0.2); }
    }

    /* ========== PARTÍCULAS ========== */
    @keyframes drift {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.6; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }
    .particle {
      position: fixed;
      top: -30px;
      font-size: 20px;
      user-select: none;
      pointer-events: none;
      z-index: 1;
      animation: drift linear infinite;
      filter: drop-shadow(0 0 4px currentColor);
    }

    /* ========== BOTÕES ========== */
    .btn-primary-rose {
      background: linear-gradient(135deg, #d83a56 0%, #e85a6f 50%, #d83a56 100%);
      background-size: 200% 100%;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
      border-radius: 16px;
    }
    .btn-primary-rose::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s ease;
    }
    .btn-primary-rose:hover::before { left: 100%; }
    .btn-primary-rose:hover {
      transform: translateY(-4px) scale(1.02);
      background-position: 100% 0;
      box-shadow: 0 15px 35px rgba(216, 58, 86, 0.4), 
                  0 0 0 1px rgba(255,255,255,0.2) inset;
    }

    .btn-primary-green {
      background: linear-gradient(135deg, #1DB954 0%, #1ed760 50%, #1DB954 100%);
      background-size: 200% 100%;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
      border-radius: 16px;
    }
    .btn-primary-green::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s ease;
    }
    .btn-primary-green:hover::before { left: 100%; }
    .btn-primary-green:hover {
      transform: translateY(-4px) scale(1.02);
      background-position: 100% 0;
      box-shadow: 0 15px 35px rgba(29, 185, 84, 0.4),
                  0 0 0 1px rgba(255,255,255,0.2) inset;
    }

    .btn-nav-back {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      border-radius: 999px;
    }
    .btn-nav-back:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateX(-5px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-secondary-rose {
      background: rgba(216, 58, 86, 0.1);
      color: #d83a56;
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    .btn-secondary-rose:hover {
      background: rgba(216, 58, 86, 0.18);
    }

    .btn-secondary-green {
      background: rgba(29, 185, 84, 0.1);
      color: #1DB954;
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    .btn-secondary-green:hover {
      background: rgba(29, 185, 84, 0.18);
    }

    /* ========== CARTA ========== */
    .carta-papel {
      background: linear-gradient(to bottom, #fffdf8, #fff9f0);
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      box-shadow: 
        0 0 0 1px rgba(216, 58, 86, 0.08),
        0 10px 40px rgba(0, 0, 0, 0.08),
        inset 0 0 60px rgba(216, 58, 86, 0.03);
      position: relative;
      border-radius: 20px;
    }
    .carta-papel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50px;
      right: 50px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(216, 58, 86, 0.15), transparent);
    }
    .carta-texto {
      font-family: 'Great Vibes', 'Playfair Display', serif;
      font-size: 1.15rem;
      line-height: 1.9;
      color: #4a1c2c;
      text-align: center;
    }
    @media (min-width: 768px) {
      .carta-texto { font-size: 1.3rem; }
    }
    .carta-assinatura {
      font-family: 'Great Vibes', cursive;
      font-size: 1.5rem;
      color: var(--rose-main);
    }
    .selo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #d83a56, #b82e47);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.2rem;
      box-shadow: 
        0 4px 15px rgba(216, 58, 86, 0.4),
        inset 0 -2px 10px rgba(0,0,0,0.2),
        inset 0 2px 10px rgba(255,255,255,0.2);
      transform: rotate(-15deg);
    }
    @media (min-width: 768px) {
      .selo { width: 70px; height: 70px; font-size: 1.5rem; }
    }

    /* ========== PLAYER ========== */
    .album-shadow {
      box-shadow: 
        0 0 0 1px rgba(255,255,255,0.05),
        0 20px 50px rgba(0,0,0,0.6),
        0 0 80px rgba(29, 185, 84, 0.15);
      border-radius: 12px;
      overflow: hidden;
    }
    .album-glow {
      position: relative;
    }
    .album-glow::after {
      content: '';
      position: absolute;
      inset: -10%;
      background: radial-gradient(circle, rgba(29,185,84,0.15) 0%, transparent 70%);
      z-index: -1;
      filter: blur(20px);
    }

    .eq-bar {
      width: 3px;
      background: linear-gradient(to top, #1DB954, #1ed760);
      border-radius: 2px;
      animation: eqPulse 0.9s ease-in-out infinite alternate;
    }
    @keyframes eqPulse {
      0% { height: 4px; opacity: 0.5; }
      100% { height: 18px; opacity: 1; }
    }
    .eq-bar:nth-child(1) { animation-delay: 0.0s; }
    .eq-bar:nth-child(2) { animation-delay: 0.15s; }
    .eq-bar:nth-child(3) { animation-delay: 0.30s; }
    .eq-bar:nth-child(4) { animation-delay: 0.45s; }
    .eq-bar:nth-child(5) { animation-delay: 0.20s; }
    .eq-bar:nth-child(6) { animation-delay: 0.35s; }

    input[type=range] {
      accent-color: #1DB954;
      height: 6px;
      border-radius: 3px;
      cursor: pointer;
      width: 100%;
    }
    input[type=range]::-webkit-slider-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 10px rgba(29,185,84,0.5);
      border: none;
      appearance: none;
    }

    .lyrics-box {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 14px;
    }

    .yt-hidden { position: absolute; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none; }
    
    .decor-line {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .decor-line::before, .decor-line::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, currentColor, transparent);
      opacity: 0.2;
    }

    /* ========== RESPONSIVIDADE ========== */
    .container-responsive {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }
    @media (min-width: 768px) {
      .container-responsive { max-width: 460px; }
    }
    @media (min-width: 1024px) {
      .container-responsive { max-width: 480px; }
    }
  </style>
</head>
<body>

  <div id="particles-container"></div>
  <div class="yt-hidden"><div id="youtube-player"></div></div>

  <!-- ====================================================== -->
  <!-- TELA INICIAL — PORTA DE ENTRADA -->
  <!-- ====================================================== -->
  <section id="tela-inicio" class="screen bg-inicio active">
    <div class="container-responsive px-2 relative z-10">
      <div class="glass-dark-premium p-6 md:p-8 scale-in text-center">
        
        <!-- Logo/Ícone Principal -->
        <div class="relative inline-block mb-6">
          <div class="w-24 h-24 mx-auto bg-gradient-to-br from-rose-500 via-rose-600 to-rose-700 rounded-full flex items-center justify-center pulse-glow-rose float-gentle">
            <i class="fa-solid fa-heart text-white text-4xl"></i>
          </div>
          <div class="absolute -bottom-1 -right-1 w-9 h-9 bg-green-500 rounded-full flex items-center justify-center border-4 border-gray-900">
            <i class="fa-solid fa-gem text-white text-xs"></i>
          </div>
        </div>
        
        <h1 class="text-3xl font-extrabold text-white mb-2 tracking-tight">
          Cartas com Carinho
        </h1>
        <p class="text-base text-indigo-300 mb-1">Uma mensagem feita de coração</p>
        <p class="text-xs text-gray-400 mb-6">✨ Demonstração Completa e Interativa ✨</p>
        
        <!-- Divisória Decorativa -->
        <div class="decor-line text-gray-500 mb-6">
          <span class="text-xs uppercase tracking-widest">Escolha uma opção</span>
        </div>
        
        <!-- Botões de Navegação -->
        <div class="space-y-3 mb-6">
          <button onclick="abrirCarta()" class="btn-primary-rose w-full text-white font-bold py-3 px-5 flex items-center justify-center gap-3">
            <div class="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center flex-shrink-0">
              <i class="fa-solid fa-envelope"></i>
            </div>
            <div class="text-left">
              <div>💌 Ver Carta Escrita</div>
              <div class="text-xs font-normal opacity-80">Mensagem pessoal e exclusiva</div>
            </div>
          </button>
          
          <button onclick="abrirPlayer()" class="btn-primary-green w-full text-black font-bold py-3 px-5 flex items-center justify-center gap-3">
            <div class="w-9 h-9 bg-black/10 rounded-full flex items-center justify-center flex-shrink-0">
              <i class="fa-brands fa-spotify"></i>
            </div>
            <div class="text-left">
              <div>🎧 Ouvir Carta Sonora</div>
              <div class="text-xs font-normal opacity-70">Música + mensagem em áudio</div>
            </div>
          </button>
        </div>
        
        <p class="text-xs text-gray-500">
          <i class="fa-solid fa-lock mr-1"></i> 
          Experiência completa — clique e aproveite 💫
        </p>
      </div>
    </div>
  </section
